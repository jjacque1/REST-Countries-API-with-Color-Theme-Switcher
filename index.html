<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST Countries API</title>

    <!-- Compiled TypeScript -->
    <script type="module" src="./dist/main.js" defer></script>

    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css" />

    <!--Font awesome icon link-->
    <script
      src="https://kit.fontawesome.com/a84b1620d5.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!--HEADER-->

    <header class="header">
      <h1 class="title">Where in the world?</h1>
      <button id="toggle-btn" class="toggle-btn">
        <i class="fa-regular fa-moon"></i> Dark Mode
      </button>
    </header>

    <!--MAIN SECTION-->

    <section class="search-filter">
      <!--SEARCH INPUT SECTION-->

      <div class="input-container">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Enter a country"
          aria-label="Search countries"
        />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <!--FILTER SECTTION-->

      <select id="region-filter" aria-label="Filter by region">
        <option value="">Filter by Region</option>
        <option value="Africa">Africa</option>
        <option value="Americas">Americas</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Oceania">Oceania</option>
      </select>
    </section>

    <!--COUNTRY CARD CONTAINER-->

    <div id="container"></div>

     <!-- Country details modal -->
  <div id="country-modal" class="modal">
    <div class="modal-inner">
      <button id="modal-close" class="modal-close">
        Back
      </button>
      <div id="modal-body" class="modal-body">
        <!-- Country details will be here -->
      </div>
    </div>
  </div>
  </body>
</html>
