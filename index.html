<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST Countries API</title>

    <!-- Compiled TypeScript -->
    <script type="module" src="./dist/main.js" defer></script>


    <!-- Styles -->
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://kit.fontawesome.com/a84b1620d5.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>


    <!-- Header Starts here -->
    <header class="header">
      <h1 class="title">Where in the world?</h1>
      <button id="toggle-btn" class="toggle-btn">
        <i class="fa-regular fa-moon"></i> Dark Mode
      </button>
    </header>
 <!-- Header Ends here -->


    <!-- Search Input Starts here-->
    <section class="search-filter">
      <div class="input-container">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Enter a country"
          aria-label="Search countries"
        />
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

     <!-- Search Input Ends here-->
      
     
     <!-- Filter Starts here-->
     
  
  <select id="region-filter" aria-label="Filter by region">
    <option class="option"  value="">Filter by Region</option>
    <option class="option" value="Africa">Africa</option>
    <option class="option" value="Americas">Americas</option>
    <option class="option" value="Asia">Asia</option>
    <option class="option" value="Europe">Europe</option>
    <option class="option" value="Oceania">Oceania</option>
  </select>

<!--Filter Ends here-->


<div id="container">

</div>
  </body>
</html>
